<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neon Runner v3.0</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  color-scheme:dark;
  --ac:#ffcc00;
  --cd:#1b2340e6;
  --fg:#ffffff;
  --bg:#0b1020;
  --font-scale:1;
}
body.light{
  color-scheme:light;
  --cd:#f2f5ffeb;
  --fg:#101626;
  --bg:#dfe7ff;
}
body.hc{
  --ac:#ffff00;
  --cd:#000000f2;
  --fg:#ffffff;
  --bg:#000000;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:600 calc(15px * var(--font-scale)) system-ui,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px;display:none;font-size:calc(17px * var(--font-scale));text-shadow:0 1px 3px #000;z-index:4;pointer-events:none}
#hud-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hud-mbar{width:min(240px,46vw);height:7px;background:#0008;border-radius:6px;overflow:hidden;margin-top:5px}
#hud-mbar i{display:block;height:100%;background:var(--ac);transition:width .2s}
#pw{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
#pw span{background:#0008;color:#fff;border-radius:10px;padding:3px 8px;font-size:calc(13px * var(--font-scale))}
#pb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);display:none;z-index:6}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;pointer-events:none;text-shadow:0 4px 12px #000;z-index:5}
#ui{position:fixed;inset:0;display:none;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none;z-index:7}
#ui>*{pointer-events:auto}
.b{background:var(--ac);color:#111;border:0;border-radius:14px;padding:10px 15px;font:800 calc(14px * var(--font-scale)) system-ui;cursor:pointer;transition:transform .12s,opacity .15s}
.b:hover{transform:scale(1.04)}
.b:active{transform:scale(.97)}
.b.s{padding:8px 12px;background:#2c3763;color:#fff}
body.light .b.s{background:#cfd8f5;color:#101626}
.b.big{font-size:calc(26px * var(--font-scale));padding:16px 56px;animation:pl 1s infinite alternate;align-self:center}
.b:disabled{opacity:.4;pointer-events:none}
@keyframes pl{to{transform:scale(1.07)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulseGold{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.anim-in{animation:slideUp .28s ease-out}
.top{display:flex;gap:10px;align-items:center;background:var(--cd);padding:8px 12px;border-radius:16px;font-size:calc(16px * var(--font-scale));flex-wrap:wrap}
.top .right{margin-left:auto;display:flex;gap:6px}
.bot{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card{background:var(--cd);border-radius:14px;padding:10px 12px;margin:5px 0}
.panel{background:var(--cd);border-radius:18px;padding:14px;margin:auto;width:min(600px,100%);max-height:86%;overflow:auto;box-shadow:0 12px 35px #0007}
.it{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#0003;border-radius:12px;padding:8px 10px;margin:6px 0}
body.light .it{background:#0001}
.bar{height:8px;background:#0006;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ac)}
h2{margin:4px 0 8px}
small{opacity:.8;font-weight:500}
#cb{position:fixed;left:50%;top:110px;transform:translateX(-50%);font-size:calc(36px * var(--font-scale));font-weight:900;color:var(--ac);text-shadow:0 3px 10px #000;pointer-events:none;text-align:center;z-index:4;display:none}
#cb.pulse{animation:pulseGold .45s ease-in-out}
#toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);background:#0b1020ee;color:#fff;border:2px solid #4cf;border-radius:12px;padding:8px 16px;display:none;z-index:8;pointer-events:none;font-weight:700;text-align:center}
#sfxcap{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#000b;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;display:none;z-index:6;pointer-events:none}
#ab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:none;border-radius:50%;width:80px;height:80px;padding:4px;font-size:13px;z-index:6;box-shadow:0 4px 14px #0008}
.badge{background:#ff3b30;color:#fff;border-radius:999px;padding:1px 6px;font-size:11px;margin-left:4px;animation:pl .7s infinite alternate}
.prev-wrap{display:flex;align-items:center;gap:12px;background:#0004;border-radius:14px;padding:10px;margin:8px 0}
canvas#prev{width:96px;height:96px;border-radius:12px;background:#0b1020}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hud-top"><b id="hd">0 m</b> · <b id="hc">🪙 0</b> · <b id="hs">0</b> <span id="hrev"></span> <span id="hmode" style="opacity:.85"></span></div>
  <div id="hud-mbar"><i id="hud-mfill" style="width:0%"></i></div>
  <div id="pw"></div>
</div>
<button id="pb" class="b s">⏸</button>
<div id="cb"></div>
<div id="toast"></div>
<div id="sfxcap"></div>
<button id="ab" class="b" onclick="useAb()"></button>
<div id="big"></div>
<div id="ui"></div>

<script>
// ===== DOM & CANVAS CACHE =====
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d');
const DOM={
  hud:$('#hud'),hd:$('#hd'),hc:$('#hc'),hs:$('#hs'),hrev:$('#hrev'),hmode:$('#hmode'),
  mfill:$('#hud-mfill'),pw:$('#pw'),pb:$('#pb'),cb:$('#cb'),toast:$('#toast'),
  sfxcap:$('#sfxcap'),ab:$('#ab'),big:$('#big'),ui:$('#ui')
};
let W=0,H=0,LW=0,HY=0,BY=0;
const BASE_F=9;
let dynF=BASE_F;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;LW=Math.min(W*.24,H*.3);HY=H*.3;BY=H*.8}
addEventListener('resize',rs);rs();

// ===== GAME DATA =====
const CH=[
  {id:'rex',n:'Rex',p:0,r:'Comum',c:'#4aa3ff',a:'Passiva: +5% moedas · Ativa: Impulso + imune a baixos'},
  {id:'luna',n:'Luna',p:350,r:'Raro',c:'#ff5fa2',a:'Passiva: +10% moedas & ímã 2m · Ativa: Ímã +50% valor'},
  {id:'kai',n:'Kai',p:850,r:'Raro',c:'#3ddc84',a:'Passiva: Pulo duplo · Ativa: Sprint +30% vel & invencível'},
  {id:'pixel',n:'Pixel',p:1100,r:'Raro',c:'#00e5ff',a:'Passiva: +1 pulo aéreo · Ativa: Glitch (teleporte 5m)'},
  {id:'zed',n:'Zed',p:2100,r:'Épico',c:'#b36bff',a:'Passiva: Aura de ímã & +10% combo · Ativa: Obstáculos -> 3 moedas'},
  {id:'blaze',n:'Blaze',p:2300,r:'Épico',c:'#ff5722',a:'Passiva: +15% velocidade · Ativa: Chamas (destrói drones/obs 3s)'},
  {id:'nova',n:'Nova',p:0,keys:5,r:'Lendário',c:'#ffb020',a:'Passiva: Revive 1x & escudo inicial · Ativa: Escudo refletor'},
  {id:'echo',n:'Echo',p:0,keys:6,r:'Lendário',c:'#9ef0ff',a:'Passiva: Ímã forte permanente · Ativa: Fantasma 5s'}
];
const RC={Comum:'#9aa',Raro:'#4aa3ff',Épico:'#b36bff',Lendário:'#ffb020'};
const SKN=[
  {n:'Padrão',p:0},
  {n:'Sombra',p:150,c:'#383e4e'},
  {n:'Fogo',p:250,c:'#ff4d2e'},
  {n:'Neon Cyber',p:350,c:'#00f5d4'},
  {n:'Dourada (Nível 5)',p:0,gold:1,c:'#ffd700'}
];
const HOVS=[
  {id:'std',n:'Aero Cyan',p:0,c:'#00cccc'},
  {id:'magma',n:'Magma Blade',p:400,c:'#ff4500'},
  {id:'star',n:'Starlight',p:750,c:'#d580ff'}
];
const EMOTES=[
  {id:'wave',n:'Acenar',p:0},
  {id:'dance',n:'Dança Neon',p:200},
  {id:'flip',n:'Mortal',p:350},
  {id:'spin',n:'Pião Turbo',p:500},
  {id:'flex',n:'Vitória',p:650}
];
const PU={
  mag:{n:'Ímã',d:8,i:'🧲',c:'#e33'},
  shd:{n:'Escudo',d:0,i:'🛡️',c:'#39f'},
  x2:{n:'x2',d:10,i:'✖2',c:'#fa0'},
  sh:{n:'Sneakers',d:10,i:'👟',c:'#2c8'},
  jet:{n:'Rocket',d:6,i:'🚀',c:'#c4f'},
  hov:{n:'Hoverboard',d:15,i:'🛹',c:'#0cc'},
  gh:{n:'Fantasma',d:5,i:'👻',c:'#89a'},
  rain:{n:'Coin Rain',d:0,i:'💰',c:'#fb0'},
  tw:{n:'Time Warp',d:4,i:'⏳',c:'#6cf'},
  drone:{n:'Drone Coletor',d:12,i:'🤖',c:'#2ed573'},
  sc:{n:'Second Chance',d:0,i:'💖',c:'#ff4757'}
};
const AB={rex:'Impulso',luna:'Ímã+',kai:'Sprint',pixel:'Glitch',zed:'Feitiço',blaze:'Chamas',nova:'Refletor',echo:'Fantasma'};
const UP={
  mag:{n:'Ímã dura +2s',p:200,s:2},
  hov:{n:'Hoverboard +3s',p:200,s:3},
  x2:{n:'Multiplicador +2s',p:200,s:2},
  sh:{n:'Sneakers +2s',p:200,s:2},
  jet:{n:'Rocket +1.5s',p:250,s:1.5},
  gh:{n:'Fantasma +1.5s',p:250,s:1.5}
};
const MP=[
  {k:'dist',t:'Corra %n m',g:1000,r:{coins:150,frags:2}},
  {k:'coins',t:'Colete %n moedas',g:200,r:{coins:120,frags:2}},
  {k:'pw',t:'Use %n power-ups',g:3,r:{keys:1}},
  {k:'jumps',t:'Dê %n pulos',g:15,r:{coins:120}},
  {k:'nm',t:'Faça %n Near Misses',g:10,r:{coins:180,frags:3}},
  {k:'wr',t:'Faça %n Wall Runs',g:5,r:{coins:200,frags:3}},
  {k:'gr',t:'Faça %n Grinds',g:3,r:{coins:180,frags:2}},
  {k:'tr',t:'Complete %n Tricks no ar',g:5,r:{coins:220,frags:3}},
  {k:'cm5',t:'Atinja Combo x5 (%n vez)',g:1,r:{keys:1,frags:4}},
  {k:'rev',t:'Reviva %n vez na corrida',g:1,r:{coins:250,frags:3}}
];
const WP=[
  {k:'dist',t:'[Semanal] Corra %n m',g:8000,r:{coins:800,keys:2,frags:10}},
  {k:'coins',t:'[Semanal] Colete %n moedas',g:1500,r:{coins:700,frags:8}},
  {k:'nm',t:'[Semanal] Faça %n Near Misses',g:50,r:{coins:600,keys:1,frags:8}},
  {k:'wr',t:'[Semanal] Faça %n Wall Runs',g:25,r:{coins:650,frags:8}},
  {k:'tr',t:'[Semanal] Faça %n Tricks',g:25,r:{coins:750,keys:2,frags:10}}
];
const DR=[{coins:60},{coins:120},{coins:180},{keys:1,coins:120},{coins:260},{coins:350},{keys:2,coins:500}];
const MOCK=[{n:'NeonKing',s:48210},{n:'Ana_Run',s:31900},{n:'Dudu',s:20450}];
const MODES={
  endless:{n:'Infinito',desc:'Corrida clássica sem fim com biomas dinâmicos.'},
  time:{n:'Contrarrelógio',desc:'60s para percorrer a maior distância possível!'},
  coins:{n:'Chuva de Moedas',desc:'90s sem morte por obstáculo: foco total em moedas!'},
  zen:{n:'Modo Zen',desc:'Sem obstáculos e sem estresse. Apenas corra e relaxe.'},
  boss:{n:'Modo Chefe',desc:'Um Drone Chefe gigante te persegue! Colete núcleos para derrotá-lo.'},
  daily:{n:'Desafio Diário',desc:'Modificador especial do dia com recompensa extra!'}
};
const DAILY_MODS=[
  {id:'one_lane',n:'Pista Única (Centro)',desc:'Apenas a pista do meio está segura!'},
  {id:'high_grav',n:'Gravidade Pesada',desc:'Pulos mais curtos e quedas rápidas!'},
  {id:'no_pw',n:'Sem Power-ups',desc:'Habilidade pura: zero power-ups na pista!'},
  {id:'turbo_world',n:'Mundo Acelerado',desc:'Velocidade base +25% desde o início!'}
];
const I18N={
  pt:{play:'JOGAR',shop:'🛒 Loja',chars:'🧑 Heróis',miss:'📋 Missões',pass:'🎫 Passe',rank:'🏅 Ranking',modes:'🎮 Modos',chest:'🎁 Baú',back:'Voltar'},
  en:{play:'PLAY',shop:'🛒 Shop',chars:'🧑 Heroes',miss:'📋 Quests',pass:'🎫 Pass',rank:'🏅 Rank',modes:'🎮 Modes',chest:'🎁 Chest',back:'Back'},
  es:{play:'JUGAR',shop:'🛒 Tienda',chars:'🧑 Héroes',miss:'📋 Misiones',pass:'🎫 Pase',rank:'🏅 Ranking',modes:'🎮 Modos',chest:'🎁 Cofre',back:'Volver'}
};

// ===== SAVE & ANALYTICS =====
const KEY='neonrunner_v3';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('neonrunner_v1'))}catch(e){}
S=Object.assign({
  coins:100,keys:2,frags:5,hs:0,dist:0,
  owned:['rex'],eq:'rex',charLv:{rex:1},ownSk:{},sk:{},
  ownHov:['std'],eqHov:'std',ownEm:['wave'],eqEm:'wave',
  up:{},ms:{day:'',l:[]},wms:{wk:'',l:[]},dl:{last:'',n:0},
  hist:{endless:[],time:[],coins:[],zen:[],boss:[],daily:[]},
  chest:0,snd:1,vib:1,music:1,voice:1,
  swipeSens:1,gameSpd:1,theme:'dark',hc:0,cbMode:'none',
  reduceMotion:0,fontScale:1,captions:0,lang:'pt',
  keysMap:{l:'arrowleft',r:'arrowright',u:'arrowup',d:'arrowdown',ab:'e'},
  onboarded:0,tutDone:0,mode:'endless',flash:{end:0,idx:0},
  commStart:Date.now(),analytics:[]
},S||{});
if(Array.isArray(S.hist))S.hist={endless:S.hist,time:[],coins:[],zen:[],boss:[],daily:[]};
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function track(ev,data={}){
  S.analytics.push({ev,t:Date.now(),...data});
  if(S.analytics.length>80)S.analytics.shift();
}
const today=()=>new Date().toISOString().slice(0,10);
const weekId=()=>{const d=new Date();return d.getFullYear()+'-W'+Math.ceil((((d-new Date(d.getFullYear(),0,1))/864e5)+1)/7)};
const CHR=()=>CH.find(c=>c.id==S.eq)||CH[0];
const CLV=id=>S.charLv[id]||1;
const fmt=r=>[r.coins?'🪙'+r.coins:'',r.keys?'🔑'+r.keys:'',r.frags?'🧩'+r.frags:''].filter(Boolean).join(' ');
const fmtNum=n=>Math.floor(n).toLocaleString('pt-BR');
const T=k=>(I18N[S.lang]||I18N.pt)[k]||k;

function applyPrefs(){
  document.body.classList.toggle('light',S.theme==='light');
  document.body.classList.toggle('hc',!!S.hc);
  document.documentElement.style.setProperty('--font-scale',S.fontScale||1);
}
applyPrefs();

function gm(){
  if(S.ms.day!==today()){
    S.ms={day:today(),l:[...MP].sort(()=>Math.random()-.5).slice(0,3).map(m=>({k:m.k,t:m.t.replace('%n',m.g),g:m.g,r:m.r,p:0,c:0}))};
    sv();
  }
  if(S.wms.wk!==weekId()){
    S.wms={wk:weekId(),l:WP.map(m=>({k:m.k,t:m.t.replace('%n',m.g),g:m.g,r:m.r,p:0,c:0}))};
    sv();
  }
}

// ===== AUDIO, PROCEDURAL MUSIC & SPEECH =====
let AC=null,bgmTimer=null,bgmStep=0;
function cap(txt){
  if(!S.captions)return;
  DOM.sfxcap.textContent=txt;
  DOM.sfxcap.style.display='block';
  clearTimeout(cap.t);
  cap.t=setTimeout(()=>DOM.sfxcap.style.display='none',1200);
}
function snd(f,d=.1,t='square',v=.05,f2){
  if(!S.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),a=AC.createGain();
    o.type=t;o.frequency.value=f;
    if(f2)o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);
    a.gain.value=v;a.gain.linearRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function say(txt){
  if(!S.voice||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='en-US';u.rate=1.25;u.pitch=1.15;u.volume=.45;
    speechSynthesis.speak(u);
  }catch(e){}
}
function startMusic(){
  stopMusic();
  if(!S.music||!S.snd)return;
  bgmTimer=setInterval(()=>{
    if(mode!=='run'||!G||G.pause||G.dead)return;
    const biomeRoot=[110,130.8,98,146.8,123.5][Math.floor(BL)%5];
    const scale=[1,1.2,1.5,1.8,2];
    const note=biomeRoot*scale[bgmStep%scale.length];
    snd(note,.12,'triangle',.022);
    if(bgmStep%2===0)snd(65,.06,'sine',.035,35);
    if(G.sp>20&&bgmStep%2===1)snd(900,.03,'square',.012);
    if(G.sp>26&&bgmStep%4===2)snd(note*2,.15,'sawtooth',.015);
    bgmStep++;
  },180);
}
function stopMusic(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
const vib=n=>{if(S.vib)try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

// ===== OBJECT POOLS =====
const PT_MAX=200;
const ptPool=Array.from({length:PT_MAX},()=>({act:0,x:0,y:0,vx:0,vy:0,l:0,c:'#fc0',sz:4}));
let ptIdx=0;
function spawnPt(x,y,vx,vy,l=.4,c='#fc0',sz=4){
  const p=ptPool[ptIdx];
  ptIdx=(ptIdx+1)%PT_MAX;
  p.act=1;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=l;p.c=c;p.sz=sz;
}

// ===== STATE & UI HELPERS =====
let G=null,mode='lobby',lastT=0,rot=0,tab='p',lobbyAnim={t:0,kind:'idle',taps:0},cutscene=0;
const ui=h=>{DOM.ui.innerHTML=h;DOM.ui.style.display=h?'flex':'none'};
const hudOn=v=>{
  const d=v?'block':'none';
  DOM.hud.style.display=DOM.pb.style.display=DOM.ab.style.display=d;
  if(!v)DOM.cb.style.display='none';
};
function toast(t){
  DOM.toast.textContent=t;
  DOM.toast.style.display='block';
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>DOM.toast.style.display='none',2600);
}

// ===== ONBOARDING =====
let obStep=0;
function showOnboarding(){
  const steps=[
    {t:'Bem-vindo ao Neon Runner v3.0! 🚀',d:'Deslize para os lados (ou ← →) para trocar de pista, para cima (↑) para pular e para baixo (↓) para rolar.'},
    {t:'Manobras & Parkour 🛹',d:'Pule em direção a um trem lateral para fazer Wall Run! Caia sobre trilhos elevados para fazer Grind e ganhe multiplicadores de Combo.'},
    {t:'Heróis, Poderes & Modos ⚡',d:'Cada personagem tem passiva + habilidade ativa (botão no canto ou tecla E). Explore 6 modos de jogo no Lobby!'}
  ];
  const st=steps[obStep];
  ui(`<div></div><div class="panel anim-in" style="text-align:center">
    <h2>${st.t}</h2><p style="line-height:1.45">${st.d}</p>
    <small>Passo ${obStep+1} de 3</small><br><br>
    <div class="row">
      <button class="b s" onclick="finishOb()">Pular</button>
      <button class="b" onclick="nextOb()">${obStep<2?'Próximo':'Começar!'}</button>
    </div>
  </div><div></div>`);
}
function nextOb(){snd(650,.08);if(++obStep>2)finishOb();else showOnboarding()}
function finishOb(){S.onboarded=1;sv();lobby()}

// ===== LOBBY & MENUS =====
function getDailyMod(){
  const idx=Math.floor(Date.now()/864e5)%DAILY_MODS.length;
  return DAILY_MODS[idx];
}
function getFlashOffer(){
  const now=Date.now();
  if(!S.flash||now>S.flash.end){
    const slot=Math.floor(now/(6*3600*1000));
    S.flash={end:now+30*60*1000,idx:slot%3};
    sv();
  }
  const offers=[
    {id:'f_keys',n:'Pacote 5 Chaves + 10 Frags',p:350,old:700,fn:()=>{S.keys+=5;S.frags+=10}},
    {id:'f_coins',n:'Cofre 1.200 Moedas',p:2,keyCost:1,old:5,fn:()=>{S.coins+=1200}},
    {id:'f_frags',n:'20 Fragmentos de Herói',p:300,old:600,fn:()=>{S.frags+=20}}
  ];
  return offers[S.flash.idx];
}

function lobby(){
  if(!S.onboarded){showOnboarding();return}
  mode='lobby';G=null;stopMusic();
  BS=BL=[0,1,3][ss().id%3];
  gm();hudOn(0);DOM.big.textContent='';
  const cr=Date.now()>=S.chest;
  const chestSec=Math.max(0,Math.ceil((S.chest-Date.now())/1000));
  const dr=S.dl.last!==today();

function buyC(id){
  const c=CH.find(x=>x.id==id);
  if(c.keys){
    if(S.keys>=c.keys){S.keys-=c.keys;S.owned.push(id);S.charLv[id]=1;S.eq=id;sv();snd(700,.2);track('buy_char',{id});shop()}
    else snd(150,.2);
  }else{
    if(S.coins>=c.p){S.coins-=c.p;S.owned.push(id);S.charLv[id]=1;S.eq=id;sv();snd(700,.2);track('buy_char',{id});shop()}
    else snd(150,.2);
  }
}
function upChar(id){
  const lv=CLV(id),cost=lv*5;
  if(lv<5&&S.frags>=cost){S.frags-=cost;S.charLv[id]=lv+1;if(lv+1===5)S.sk[id]=4;sv();snd(850,.25);toast('⬆️ Herói subiu para Nível '+(lv+1)+'!');shop('p')}
  else snd(150,.2);
}
function eqp(id){S.eq=id;prevSel=id;sv();shop()}
function buyS(i){if(S.coins>=SKN[i].p){S.coins-=SKN[i].p;S.ownSk[S.eq+i]=1;S.sk[S.eq]=i;sv();snd(700,.2);shop()}else snd(150,.2)}
function eqs(i){S.sk[S.eq]=i;sv();shop()}
function buyHov(id){const h=HOVS.find(x=>x.id==id);if(S.coins>=h.p){S.coins-=h.p;S.ownHov.push(id);S.eqHov=id;sv();snd(700,.2);shop('h')}else snd(150,.2)}
function buyEm(id){const e=EMOTES.find(x=>x.id==id);if(S.coins>=e.p){S.coins-=e.p;S.ownEm.push(id);S.eqEm=id;sv();snd(700,.2);shop('e')}else snd(150,.2)}
function buyU(k){const l=S.up[k]||0,p=UP[k].p*(l+1);if(S.coins>=p){S.coins-=p;S.up[k]=l+1;sv();snd(700,.2);shop()}else snd(150,.2)}
function buyFlash(){
  const fo=getFlashOffer();
  if(fo.keyCost){if(S.keys<fo.p)return snd(150,.2);S.keys-=fo.p}
  else{if(S.coins<fo.p)return snd(150,.2);S.coins-=fo.p}
  fo.fn();S.flash.end=Date.now()+6*3600*1000;sv();snd(900,.25);toast('⚡ Oferta resgatada!');shop('b');
}
function buyBundle(){
  if(S.coins<450)return snd(150,.2);
  S.coins-=450;
  if(!S.owned.includes('luna')){S.owned.push('luna');S.charLv.luna=1}
  S.ownSk['luna2']=1;S.keys+=3;sv();snd(900,.3);toast('📦 Pacote adquirido!');shop('b');
}
function chest(){
  const r=Date.now()<S.chest;
  if(r){if(S.keys<1)return snd(150,.2);S.keys--}
  S.coins+=120+Math.floor(Math.random()*200);
  S.frags+=2+Math.floor(Math.random()*4);

const SR=(i,p)=>p?{coins:100+i*100,keys:i%2?0:1,frags:2}:{coins:50+i*50,keys:i%3?0:1};

// ===== INPUTS =====
function act(a){
  if(mode!='run'||G.pause||G.dead)return;
  if(G.dmod==='one_lane'&&(a==='l'||a==='r')){toast('Modificador: Pista Única!');return}
  if(G.pw.hov>0&&G.y>.6&&!G.gr&&!G.wr){
    if(a=='d'){trick('grab');return}
    if(a=='l'||a=='r')trick('spin');
  }
  if(a=='l'||a=='r'){
    const dr=a=='l'?-1:1;
    if(G.wr){
      if(dr!=G.wr.dir){G.wr=0;G.vy=5;G.lane=Math.max(-1,Math.min(1,G.lane+dr))}
    }else if(!(G.y>.5&&!G.gr&&tryWR(dr))){
      const nl=Math.max(-1,Math.min(1,G.lane+dr));
      if(nl===G.lane)G.shake=3;
      G.lane=nl;
    }
  }
  if(a=='u'){
    const maxJumps=CHR().id==='kai'||CHR().id==='pixel'?1:0;
    const jPow=(G.pw.sh>0?13.2:10.6)*(G.dmod==='high_grav'?.82:1);
    if(G.gr||G.wr){
      G.gr=0;G.wr=0;G.vy=jPow;G.sq=-.35;snd(500,.15,'sine',.08,800);cap('[Pulo]');
    }else if(G.y<=.01||G.coyote>0){
      G.coyote=0;G.vy=jPow;G.jumps++;G.sq=-.35;
      for(let i=0;i<6;i++)spawnPt(W/2+G.px*LW,BY,(Math.random()-.5)*140,-80*Math.random(),.35,'#fff',3);
      snd(500,.15,'sine',.08,800);cap('[Pulo]');
    }else if(G.dj<maxJumps){
      G.dj++;G.vy=10;snd(620,.15,'sine',.08,920);cap('[Pulo Duplo]');
    }else{
      G.jb=.12;
    }
  }
  if(a=='d'){
    G.roll=.7;
    if(G.y>0)G.vy=-28;
    snd(300,.15,'sine',.08,150);cap('[Rolar]');
  }
}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const km=S.keysMap;
  if(k===km.l||k==='a')act('l');
  else if(k===km.r||k==='d')act('r');
  else if(k===km.u||k==='w'||k===' ') {e.preventDefault();act('u')}
  else if(k===km.d||k==='s')act('d');
  else if(k===km.ab||k==='shift')useAb();
  else if(k==='p'||k==='escape')pause();
});

let tx=null,ty=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  if(tx==null)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  tx=null;
  const thresh=30/(S.swipeSens||1);
  if(Math.max(Math.abs(dx),Math.abs(dy))<thresh)return;
  Math.abs(dx)>Math.abs(dy)?act(dx>0?'r':'l'):act(dy<0?'u':'d');
});

cv.addEventListener('click',()=>{
  if(mode==='lobby'&&!DOM.ui.querySelector('.panel')){
    lobbyAnim.t=1.2;
    lobbyAnim.taps++;

  }
});

function useAb(){

  G.abt=Math.max(12,30-(lv-1)*4);

  if(id==='luna'){G.pw.mag=6;G.pw.x2=Math.max(G.pw.x2||0,6);bump(30,'ÍMÃ LUNAR')}
  if(id==='kai'){G.inv=2.4;G.boost=2.4;bump(30,'SPRINT KAI')}
  if(id==='pixel'){G.d+=5;G.inv=1;G.flashWhite=.35;bump(40,'GLITCH TELEPORT')}
  if(id==='zed'){
    G.ob.forEach(o=>{if(!o.x&&o.t!='c'&&o.t!='p'&&o.z-G.d<28&&o.z>G.d){o.x=1;G.coins+=3;bump(25,'FEITIÇO ZED')}});
  }
  if(id==='blaze'){G.blazeTrail=3;G.inv=3;bump(40,'RASTRO DE CHAMAS')}

}

function pause(){

  else ui('');
}
DOM.pb.onclick=pause;

function dur(k){
  const bonus=1+(G?((G.lv-1)*0.05):0);
  return (PU[k].d+(S.up[k]||0)*(UP[k]?UP[k].s:0))*bonus;
}

// ===== NAMED SPAWN PATTERNS =====
function addOb(t,l,o){
  if(G.dmod==='one_lane'&&l!==0&&t!=='tr')return;
  G.ob.push(Object.assign({t,l,z:G.nz,len:1,h:0},o));
}

const PATTERNS={
  coinsLine:(z,lane)=>{
    for(let i=0;i<8;i++)addOb('c',lane,{z:z+i*1.6,g:Math.random()<.07,gm:i===7&&Math.random()<.35});
    return 15;
  },
  lowBarrier:(z,lane)=>{
    addOb('low',lane,{z:z+6});
    for(let i=0;i<5;i++)addOb('c',lane,{z:z+4+i,h:Math.sin(i/4*Math.PI)*1.8});
    return 15;
  },
  highTunnel:(z,lane)=>{
    addOb('high',0,{z:z+6,w:1});
    for(let i=0;i<4;i++)addOb('c',lane,{z:z+4+i*1.2});
    return 15;
  },
  tunnelLong:(z,lane)=>{
    for(let k=0;k<3;k++)addOb('high',0,{z:z+6+k*5,w:1});
    for(let i=0;i<6;i++)addOb('c',lane,{z:z+6+i*2.4});
    return 24;
  },
  trains:(z,lane,p)=>{
    const ls=[-1,0,1].filter(l=>l!==lane);
    if(Math.random()<.4)ls.pop();
    const tl=Math.random()<.5?12:6;
    ls.forEach(l=>addOb('tr',l,{z:z+6,len:tl,mv:0,gh:p>.15&&Math.random()<.28}));
    for(let i=0;i<5;i++)addOb('c',lane,{z:z+5+i*1.5});
    return 16;
  },
  movingTrain:(z,lane)=>{
    addOb('tr',lane,{z:z+14,len:10,mv:1});
    const safe=lane===0?1:0;
    for(let i=0;i<5;i++)addOb('c',safe,{z:z+6+i*1.6});
    snd(190,.25,'sawtooth',.06,140);
    cap('[Trem em movimento!]');
    return 22;
  },
  trainCorridor:(z,lane)=>{
    const safe=lane;
    [-1,0,1].forEach(l=>{
      if(l!==safe)addOb('tr',l,{z:z+6,len:12,mv:0});
    });
    for(let i=0;i<7;i++)addOb('c',safe,{z:z+6+i*1.6,g:i%2===0});
    return 20;
  },
  zigzag:(z,lane)=>{
    let q=lane;
    for(let i=0;i<3;i++){
      const n=Math.max(-1,Math.min(1,q+(Math.random()<.5?-1:1)));
      q=n===q?q-1*Math.sign(q||1):n;
      [-1,0,1].filter(l=>l!==q).forEach(l=>addOb('tr',l,{z:z+6+i*7,len:3}));
      addOb('c',q,{z:z+6+i*7});
      addOb('c',q,{z:z+8+i*7});
    }
    return 25;
  },
  rampRail:(z)=>{
    const railLane=Math.random()<.5?-1:1;
    addOb('ramp',railLane,{z:z+5,len:3});
    addOb('rl',railLane,{z:z+9,len:11});
    for(let i=0;i<7;i++)addOb('c',railLane,{z:z+10+i*1.4,h:1.4});
    return 22;
  },
  grindRail:(z)=>{
    const railLane=Math.random()<.5?-1:1;
    addOb('rl',railLane,{z:z+6,len:10});
    for(let i=0;i<6;i++)addOb('c',railLane,{z:z+7+i*1.4,h:1.4});
    return 17;
  },
  electricZone:(z,lane)=>{
    addOb('el',lane,{z:z+6,len:9});
    for(let i=0;i<5;i++)addOb('c',lane,{z:z+7+i*1.6,h:1.3});
    return 18;
  },
  droneChase:(z,lane)=>{
    addOb('drone',lane,{z:z+12,tLeft:5});
    cap('[Drone perigoso!]');
    return 16;
  },
  powerUp:(z,lane)=>{
    if(G.dmod==='no_pw')return PATTERNS.coinsLine(z,lane);
    const keys=Object.keys(PU);
    addOb('p',lane,{z:z+5,k:keys[Math.floor(Math.random()*keys.length)]});
    return 14;
  },
  bossCore:(z,lane)=>{
    addOb('core',lane,{z:z+6});
    return 15;
  }
};

function spawn(){
  const d=G.d,p=Math.min(1,d/4000),z=G.nz;
  const lane=G.dmod==='one_lane'?0:(Math.floor(Math.random()*3)-1);
  if(S.mode==='zen'){
    G.nz=z+PATTERNS.coinsLine(z,lane)+8;
    return;
  }
  const weighted=[
    {w:22,f:'coinsLine'},
    {w:15,f:'lowBarrier'},
    {w:12,f:'highTunnel'},
    {w:14,f:'trains',minD:150},
    {w:10,f:'zigzag',minD:300},
    {w:9,f:'grindRail'},
    {w:8,f:'rampRail',minD:200},
    {w:8,f:'tunnelLong',minD:500},
    {w:8,f:'trainCorridor',minD:600},
    {w:7,f:'electricZone',minD:800},
    {w:7,f:'movingTrain',minD:1000},
    {w:6,f:'droneChase',minD:1400},
    {w:9,f:'powerUp'}
  ];
  if(S.mode==='boss')weighted.push({w:18,f:'bossCore'});
  const avail=weighted.filter(x=>!x.minD||d>=x.minD);
  const tot=avail.reduce((s,x)=>s+x.w,0);
  let pick=Math.random()*tot,chosen='coinsLine';
  for(const item of avail){
    if((pick-=item.w)<=0){chosen=item.f;break}
  }
  const ext=Math.max(14,PATTERNS[chosen](z,lane,p));
  G.nz=z+ext+Math.max(6,13-p*6);
}

// ===== MECHANICS, COMBO & COLLISIONS =====
function tryWR(dir){
  const L=G.lane+dir;
  if(L<-1||L>1)return false;
  const o=G.ob.find(o=>!o.x&&o.t==='tr'&&o.l===L&&o.z-G.d<.8&&o.z+o.len-G.d>2.5);
  if(!o)return false;
  G.wr={o,dir,t:1.4};
  G.vy=0;
  G.wrCount++;
  bump(60,'WALL RUN');
  return true;
}

function trick(k){
  if(G.tr)return;
  G.tr={k,t:.35};
  G.tc=(G.tc||0)+1;
  snd(700+G.tc*80,.12,'triangle',.07,1100);
}

function landT(){
  if(!G.tr)return;
  if(G.tr.t>0){
    G.stm=.5;G.t=Math.max(0,G.t-4);G.cn=0;G.cm=1;
    if(!S.reduceMotion)G.shake=8;
    snd(170,.2,'sawtooth',.1);toast('Aterrissagem ruim!');
  }else{
    G.trCount+=G.tc;
    bump(150*G.tc,'TRICK x'+G.tc);
  }
  G.tr=0;G.tc=0;
}

function bump(n,t){
  G.cn++;G.ct=3.2;
  const prevCm=G.cm;
  G.cm=Math.min(5,1+Math.floor(G.cn/4));
  const mult=CHR().id==='zed'?1.1:1;
  const gained=Math.round(n*G.cm*mult);
  G.pts+=gained;
  G.fl.push({x:W/2+G.px*LW,y:BY-LW*1.6,s:t+' +'+gained,l:1,c:'#ffcc00'});
  if(G.cm===5&&prevCm<5){
    G.hitCm5=1;
    G.flashWhite=.25;
    say('Combo!');
    cap('[COMBO MAX x5!]');
  }
  snd(500+G.cm*120,.12,'triangle',.08);
  DOM.cb.classList.remove('pulse');
  void DOM.cb.offsetWidth;
  DOM.cb.classList.add('pulse');
}

function hit(o){
  if(S.mode==='coins'||S.mode==='zen'){o.x=1;return}
  if(G.tr){G.tr=0;G.tc=0}
  if(G.blazeTrail>0){o.x=1;bump(30,'CHAMAS!');return}
  if(o.t==='tr'&&o.mv&&!G.pw.gh){
    // Colisão frontal em trem em movimento é letal (salvo revive)
    if(G.rev){
      G.rev=0;G.revCount++;G.inv=2.5;
      G.ob.forEach(x=>{if(x.z-G.d<28)x.x=1});
      snd(900,.4,'sine',.1);toast('❤️ Second Chance / Nova Revive!');return;
    }
    G.dead=1;G.slow=.75;if(!S.reduceMotion)G.shake=22;vib(220);snd(110,.65,'sawtooth',.14,35);say('Uh oh!');return;
  }
  if(G.pw.hov>0){
    delete G.pw.hov;
    G.y=Math.max(0,G.y-2);G.vy=0;
    o.x=1;if(!S.reduceMotion)G.shake=10;snd(200,.3,'sawtooth',.1);return;
  }
  if(G.shield>0){
    G.shield--;o.x=1;if(!S.reduceMotion)G.shake=10;snd(220,.3,'sawtooth',.1);
    if(CHR().id==='nova')bump(50,'ESCUDO REFLETOR');
    return;
  }
  if(!G.stm&&G.chx<=0){
    G.chx=8;G.stm=.8;G.inv=1.3;G.t=Math.max(0,G.t-8);G.cn=0;G.cm=1;
    o.x=1;if(!S.reduceMotion)G.shake=12;G.hsT=.06;vib(60);snd(180,.3,'sawtooth',.1);say('Uh oh!');cap('[Tropeço!]');return;
  }
  if(G.rev){
    G.rev=0;G.revCount++;G.inv=2.5;
    G.ob.forEach(x=>{if(x.z-G.d<28)x.x=1});
    snd(900,.4,'sine',.1);toast('❤️ Revivido!');return;
  }
  G.dead=1;G.slow=.75;if(!S.reduceMotion)G.shake=20;vib(200);snd(120,.6,'sawtooth',.12,40);say('Uh oh!');cap('[Game Over]');
}

// ===== MAIN STEP =====
function step(dt){
  if(!G||G.pause)return;
  dt*=(S.gameSpd||1);
  if(mode==='cd'){
    G.cd-=dt;
    DOM.big.textContent=G.cd>0?Math.ceil(G.cd):'VAI!';
    if(G.cd<-.4){DOM.big.textContent='';mode='run'}
    return;
  }
  if(mode!=='run')return;

  // Exponential shake decay & particles update
  G.shake*=Math.pow(.04,dt);
  for(let i=0;i<PT_MAX;i++){
    const p=ptPool[i];
    if(!p.act)continue;
    if((p.l-=dt)<=0){p.act=0;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;
  }

  if(G.dead){
    G.slow-=dt;
    dynF+=(14-dynF)*Math.min(1,dt*8);
    if(G.slow<=0){mode='over';over()}
    return;
  }

  if(G.hsT>0){G.hsT-=dt;return}
  G.t+=dt;

  if(G.timer>0){
    G.timer-=dt;
    if(G.timer<=0){G.timer=0;mode='over';over();return}
  }

  const c=CHR(),lv=G.lv,lvMult=1+(lv-1)*.05;
  const charSpd=c.id==='blaze'?1.15:1;
  G.sp=Math.min((G.dmod==='turbo_world'?17.5:14)+G.t*.25,34)*charSpd;
  dynF+=(BASE_F+Math.max(0,(G.sp-14)*0.15)-dynF)*Math.min(1,dt*4);

  G.d+=G.sp*dt*(G.stm>0?.6:1)*(G.boost>0?1.6:1)*(G.gr?1.25:1)*(G.wr?1.2:1)*(G.pw.tw>0?.6:1);
  G.inv=Math.max(0,G.inv-dt);
  G.stm=Math.max(0,G.stm-dt);
  G.chx=Math.max(0,G.chx-dt);
  G.jb=Math.max(0,G.jb-dt);
  G.coyote=Math.max(0,G.coyote-dt);
  G.blazeTrail=Math.max(0,G.blazeTrail-dt);
  G.flashWhite=Math.max(0,G.flashWhite-dt);
  G.sq*=Math.pow(.02,dt);

  BL+=(BS+Math.floor(G.d/1000)-BL)*Math.min(1,dt*.5);
  const bi=Math.round(BL);
  if(G.bn!==bi){if(G.bn!==undefined)toast('🌍 '+BIO[bi%BIO.length].n);G.bn=bi}

  if((G.ct-=dt)<=0){G.cn=0;G.cm=1;G.coinChain=0}
  for(let i=G.fl.length-1;i>=0;i--){
    if((G.fl[i].l-=dt)<=0)G.fl.splice(i,1);
  }

  const tl=G.wr?G.lane+G.wr.dir*.4:G.lane;
  G.px+=(tl-G.px)*(1-Math.exp(-dt*25));

  if(G.gr){
    const o=G.gr;
    if(o.x||o.z+o.len<G.d||Math.abs(G.px-o.l)>.6){G.gr=0;G.coyote=.12}
    else{
      G.pts+=35*dt;
      if(Math.random()<.5)spawnPt(W/2+G.px*LW,BY-LW*.55,(Math.random()-.5)*160,-120*Math.random(),.3,'#7cf',3);
    }
  }
  if(G.wr){
    const w=G.wr;w.t-=dt;
    if(w.t<=0||w.o.x||w.o.z+w.o.len<G.d){G.wr=0;G.vy=6;G.coyote=.12}
    else G.pts+=45*dt;
  }

  const jet=G.pw.jet>0;
  if(jet){
    G.y+=(2.8-G.y)*Math.min(1,dt*5);G.vy=0;
    if(Math.random()<.35)G.ob.push({t:'c',l:G.lane,z:G.d+16,len:1,h:2.7});
  }else if(G.gr||G.wr){
    G.y=G.gr?1.1:1;G.vy=0;
  }else{
    G.vy-=(G.vy>0?28:45)*dt;
    G.y+=G.vy*dt;
    if(G.y<0){
      G.y=0;G.vy=0;G.dj=0;G.sq=.48;
      for(let i=0;i<5;i++)spawnPt(W/2+G.px*LW,BY,(Math.random()-.5)*150,-60*Math.random(),.25,'#ccc',3);
      landT();
      if(G.jb>0){G.jb=0;act('u')}
    }
  }

  G.roll=Math.max(0,G.roll-dt);
  for(const k in G.pw)if((G.pw[k]-=dt)<=0)delete G.pw[k];
  while(G.nz<G.d+90)spawn();

  // Magnet & coin bonus calculation
  const hasMag=G.pw.mag>0||G.pw.drone>0||c.id==='echo'||c.id==='zed'||c.id==='luna';
  const magRange=G.pw.mag>0?8:(G.pw.drone>0?5:(c.id==='echo'?6:(c.id==='zed'?3.5:2.2)));
  const coinBonus=(G.pw.x2>0?2:1)*(c.id==='rex'?1.05*lvMult:(c.id==='luna'?(G.pw.mag>0?1.5:1.1*lvMult):1));

  for(let i=G.ob.length-1;i>=0;i--){
    const o=G.ob[i];
    if(o.x||o.z+o.len<G.d-5){G.ob.splice(i,1);continue}
    if(o.mv)o.z-=9*dt;
    if(o.t==='drone'){
      o.tLeft-=dt;
      o.l+=(G.lane-o.l)*Math.min(1,dt*2.5);
      o.z=G.d+2.2+Math.sin(G.t*5)*1.2;
      if(o.tLeft<=0){o.x=1;continue}
    }
    const r=o.z-G.d,dl=Math.abs(G.px-o.l);

    if(o.t==='c'||o.t==='p'||o.t==='core'){
      let near=r<.85&&r>-.85&&(dl<.65||(jet&&dl<1.6));
      if(o.t==='c'&&r>-1&&hasMag&&r<magRange&&dl<2.2){
        o.l+=(G.px-o.l)*Math.min(1,dt*10);
        o.z-=dt*15;
      }
      if(near){
        o.x=1;
        if(o.t==='c'){
          const val=(o.gm?10:o.g?5:1)*coinBonus;
          G.coins+=val;
          G.coinChain++;
          const pitch=Math.min(1600,880+Math.floor(G.coinChain/5)*60);
          snd(pitch,.07,'square',.04);vib(8);
          G.fl.push({x:W/2+o.l*LW,y:BY-LW*.7,s:'+'+Math.round(val),l:.55,c:'#ffe066'});
          for(let j=0;j<4;j++)spawnPt(W/2+o.l*LW,BY-LW*.5,(Math.random()-.5)*210,-210*Math.random(),.4,'#fc0',5);
        }else if(o.t==='core'){
          G.bossHp--;bump(250,'NÚCLEO COLETADO!');snd(950,.3,'sine',.1,1400);
          if(G.bossHp<=0){toast('🏆 CHEFE DERROTADO! +300 Moedas!');G.coins+=300;mode='over';over();return}
        }else{
          G.pwc++;snd(600,.3,'sine',.1,1200);if(!S.reduceMotion)G.shake=4;say('Yeah!');cap('[Power-up!]');
          if(o.k==='shd')G.shield=1;
          else if(o.k==='sc'){G.rev=1;toast('💖 Second Chance ativo!')}
          else if(o.k==='rain'){
            snd(1100,.4,'triangle',.1,1600);
            for(let j=0;j<20;j++)G.ob.push({t:'c',l:j%3-1,z:G.d+8+j*1.1,len:1,h:0});
          }else{
            G.pw[o.k]=dur(o.k);
            if(o.k==='hov')toast('Hoverboard! No ar: ↓ Grab · ← → Spin');
          }
        }
      }
      continue;
    }

    if(o.t==='ramp'){
      if(!o.u&&dl<.55&&r<.6&&r+o.len>-.5&&G.y<.5){
        o.u=1;G.vy=14.5;G.boost=1.4;bump(60,'RAMPA!');snd(650,.25,'sine',.08,1100);
      }
      continue;
    }

    if(o.t==='rl'){
      if(!G.gr&&dl<.55&&r<.6&&r+o.len>0&&G.y>=.7&&G.vy<=2){
        G.gr=o;G.dj=0;G.tr=0;G.grCount++;bump(80,'GRIND');snd(800,.2,'sawtooth',.06,1200);
      }
      continue;
    }

    if(!o.nm&&!o.w&&dl>=.55&&dl<1.15&&r<.6&&r+o.len>-.5){
      o.nm=1;G.nmCount++;bump(100,'NEAR MISS!');
    }

    if(G.inv>0||jet||G.pw.gh>0||(dl>=.55&&!o.w)||!(r<.6&&r+o.len>-.5))continue;
    if(CHR().id==='rex'&&G.boost>0&&(o.t==='low'||o.t==='cone'))continue;

    const h=(o.t==='tr')||(o.t==='drone')||(o.t==='el'&&G.y<.55&&G.roll<=0)||(o.t==='high'&&G.roll<=0&&G.y<1.6)||((o.t==='low'||o.t==='cone')&&G.y<.7);
    if(h)hit(o);
  }

  // HUD Updates (cached DOM)
  const sc=Math.floor(G.d+G.coins*10+G.pts);
  G.abt=Math.max(0,G.abt-dt);
  G.boost=Math.max(0,G.boost-dt);
  DOM.ab.textContent=G.abt>0?Math.ceil(G.abt)+'s':AB[c.id];
  DOM.ab.disabled=G.abt>0;

  if(G.cn>0){
    DOM.cb.style.display='block';
    DOM.cb.innerHTML=`COMBO x${G.cm}<br><small style="font-size:15px">${G.cn} skills</small>`;
  }else{
    DOM.cb.style.display='none';
  }

  const m0=S.ms.l.find(x=>!x.c)||S.ms.l[0];
  const curVal={dist:G.d,coins:G.coins,pw:G.pwc,jumps:G.jumps,nm:G.nmCount,wr:G.wrCount,gr:G.grCount,tr:G.trCount,cm5:G.hitCm5,rev:G.revCount}[m0.k]||0;
  DOM.mfill.style.width=Math.min(100,(m0.p+curVal)/m0.g*100)+'%';

  [...S.ms.l,...S.wms.l].forEach(m=>{
    const v={dist:G.d,coins:G.coins,pw:G.pwc,jumps:G.jumps,nm:G.nmCount,wr:G.wrCount,gr:G.grCount,tr:G.trCount,cm5:G.hitCm5,rev:G.revCount}[m.k]||0;
    if(!m.c&&!m.an&&m.p+v>=m.g){m.an=1;toast('✓ MISSÃO: '+m.t);snd(1000,.3,'sine',.1,1500)}
  });

  DOM.hd.textContent=fmtNum(G.d)+' m'+(G.timer>0?' · ⏱️'+Math.ceil(G.timer)+'s':'');
  DOM.hc.textContent='🪙 '+fmtNum(G.coins);
  DOM.hs.textContent=fmtNum(sc);
  DOM.hrev.textContent=G.rev?'❤️':'';
  DOM.pw.innerHTML=(G.shield?`<span>🛡️${G.shield>1?'x'+G.shield:''}</span>`:'')+
    Object.keys(G.pw).map(k=>`<span>${PU[k].i} ${Math.ceil(G.pw[k])}s</span>`).join('')+
    (G.blazeTrail>0?`<span>🔥 ${Math.ceil(G.blazeTrail)}s</span>`:'')+
    (S.mode==='boss'?`<span>👾 Chefe HP: ${G.bossHp}</span>`:'');
}

function over(){
  stopMusic();
  const R={
    dist:Math.floor(G.d),coins:Math.floor(G.coins),pw:G.pwc,jumps:G.jumps,
    nm:G.nmCount,wr:G.wrCount,gr:G.grCount,tr:G.trCount,cm5:G.hitCm5,rev:G.revCount
  };
  const sc=Math.floor(G.d+G.coins*10+G.pts);
  if(!G.used||!G.counted){
    const modeBonus=S.mode==='daily'?1.5:1;
    S.coins+=Math.round(R.coins*modeBonus);
    S.dist+=R.dist;
    [...S.ms.l,...S.wms.l].forEach(m=>m.p=Math.min(m.g,m.p+(R[m.k]||0)));
    G.counted=1;
    const xp=Math.floor((sc/50+R.coins/2)*modeBonus);
    ss().xp+=xp;
    ss().tok=(ss().tok||0)+Math.max(1,Math.floor(xp/15));
    G.xp=xp;
  }
  const rec=sc>S.hs;
  if(rec)S.hs=sc;
  const mh=S.hist[S.mode]||[];
  mh.push({s:sc,d:R.dist,dt:today()});
  S.hist[S.mode]=mh.sort((a,b)=>b.s-a.s).slice(0,10);
  track('run_over',{mode:S.mode,sc,dist:R.dist});
  sv();hudOn(0);
  if(rec)snd(1000,.5,'sine',.1,1600);
  const pctHs=S.hs>0?Math.min(100,Math.round(sc/S.hs*100)):100;
  ui(`<div></div><div class="panel anim-in" style="text-align:center">
    <h2>Game Over — ${MODES[S.mode].n}</h2>
    ${rec?'<b style="color:var(--ac)">🎉 Novo Recorde!</b><br>':''}
    <div class="card">
      📏 ${fmtNum(R.dist)} m · 🪙 ${fmtNum(R.coins)} · ⭐ ${fmtNum(sc)}<br>
      <small>Recorde: ${fmtNum(S.hs)} (${pctHs}%) · +${G.xp||0} XP do passe</small>
      <div class="bar"><i style="width:${pctHs}%"></i></div>
    </div>
    <div class="row">
      <button class="b" ${S.keys>0&&!G.used?'':'disabled'} onclick="revive(0)">Reviver (🔑1)</button>
      <button class="b s" ${!G.used?'':'disabled'} onclick="revive(1)">📺 Reviver (Vídeo)</button>
      <button class="b" onclick="go()">Jogar de novo</button>
      <button class="b s" onclick="lobby()">Lobby</button>
      <button class="b s" onclick="share(${sc},${R.dist})">Compartilhar Card</button>
    </div>
  </div><div></div>`);
}

function revive(freeAd){
  if(!freeAd){if(S.keys<1)return;S.keys--}
  sv();
  G.used=1;G.counted=0;G.dead=0;G.inv=2.5;
  G.ob.forEach(o=>{if(o.z-G.d<30)o.x=1});
  delete G.pw.hov;
  dynF=BASE_F;
  mode='run';hudOn(1);ui('');startMusic();
}

function share(s,d){
  const scv=document.createElement('canvas');scv.width=480;scv.height=240;
  const sg=scv.getContext('2d');
  sg.fillStyle='#0b1020';sg.fillRect(0,0,480,240);
  sg.strokeStyle='#ffcc00';sg.lineWidth=4;sg.strokeRect(10,10,460,220);
  sg.fillStyle='#ffcc00';sg.font='900 28px system-ui';sg.fillText('NEON RUNNER v3.0',28,55);
  sg.fillStyle='#fff';sg.font='700 22px system-ui';sg.fillText(`⭐ Pontuação: ${fmtNum(s)}`,28,105);
  sg.fillText(`📏 Distância: ${fmtNum(d)} m`,28,145);
  sg.font='500 16px system-ui';sg.fillStyle='#8cf';sg.fillText(`Herói: ${CHR().n} (Nv.${CLV(S.eq)}) · Modo: ${MODES[S.mode].n}`,28,190);
  const txt=`Fiz ${fmtNum(s)} pontos (${d}m) no Neon Runner v3.0!`;
  scv.toBlob(blob=>{
    try{
      if(navigator.share&&blob){
        const file=new File([blob],'neon-runner-score.png',{type:'image/png'});
        navigator.share({text:txt,files:[file]});
      }else{
        navigator.clipboard?.writeText(txt);
        alert('Resultado copiado! '+txt);
      }
    }catch(e){alert(txt)}
  });
}

// ===== RENDERING & BIOMES =====
function P(l,r,h){
  const f=G?dynF:BASE_F;
  const p=f/(f+Math.max(r,-f+1));
  return{x:W/2+l*LW*p,y:HY+(BY-HY)*p-h*LW*.5*p,p};
}
function poly(pts,c){g.fillStyle=c;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.fill()}
const lc=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),x=p(a),y=p(b);return'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join()+')'};
let BL=0,BS=0;
const BIO=[
  {n:'Natal Neon ❄️',a:'#8fa6e8',b:'#f0dcf5',g:'#c9cfe8',gr:'#7b7f9e',t:'#b04a4a',c1:'#5b6a9a',c2:'#7a86b5',pc:'#ffffff',sn:1,dt:0},
  {n:'Túnel Dourado 🚂',a:'#7a2a10',b:'#ffb347',g:'#4a2418',gr:'#6b3a22',t:'#d06030',c1:'#8a3a1a',c2:'#b4541f',pc:'#ffd27a',sn:0,dt:1},
  {n:'Deserto 🏜️',a:'#3b8fe0',b:'#ffe2a8',g:'#e9c98a',gr:'#c89a5a',t:'#7a4a28',c1:'#d9a76a',c2:'#b9824a',pc:'#f5deb3',sn:0,dt:1},
  {n:'Cidade Neon 🌃',a:'#0b0630',b:'#ff2fa0',g:'#120a2e',gr:'#241a4d',t:'#00e5ff',c1:'#3a1470',c2:'#1b3aa8',pc:'#00e5ff',sn:0,dt:1},
  {n:'Floresta 🌲',a:'#1f6b4a',b:'#bff0a0',g:'#2b4a2a',gr:'#3f5f3a',t:'#7a5a2a',c1:'#1f5a2a',c2:'#2f7a3a',pc:'#c8ff7a',sn:0,dt:1}
];
const CB_PAL={
  deuteranopia:{low:'#0072b2',tr:'#e69f00',coin:'#f0e442'},
  protanopia:{low:'#0072b2',tr:'#cc79a7',coin:'#f0e442'},
  tritanopia:{low:'#d55e00',tr:'#009e73',coin:'#ffcc00'}
};
const pal=(k,def)=>(S.cbMode!=='none'&&CB_PAL[S.cbMode]&&CB_PAL[S.cbMode][k])||def;
const bc=k=>{const i=Math.floor(BL),t=BL-i;return lc(BIO[i%BIO.length][k],BIO[(i+1)%BIO.length][k],t)};
const bw=k=>{const i=Math.floor(BL),t=BL-i;return BIO[i%BIO.length][k]*(1-t)+BIO[(i+1)%BIO.length][k]*t};

function bg(ctx=g,w=W,h=H,hy=HY){
  const hr=new Date().getHours();
  const night=(hr>=18||hr<6)?0.25:0;
  const s=ctx.createLinearGradient(0,0,0,hy+20);
  s.addColorStop(0,bc('a'));s.addColorStop(1,bc('b'));
  ctx.fillStyle=s;ctx.fillRect(0,0,w,h);
  ctx.fillStyle=bc('g');ctx.fillRect(0,hy,w,h-hy);
  if(night){ctx.fillStyle=`rgba(5,10,30,${night})`;ctx.fillRect(0,0,w,h)}
}

function dc(cx,by,s,c,t,ro,roll,ctx=g){
  ctx.save();ctx.translate(cx,by);
  ctx.scale(ro!=null?Math.cos(ro):1,1);
  const w=Math.sin(t*12)*.25*s;
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,0,.42*s,.13*s,0,0,7);ctx.fill();
  if(roll){
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,-.4*s,.45*s,.35*s,0,0,7);ctx.fill();
    ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(.2*s,-.55*s,.15*s,0,7);ctx.fill();
  }else{
    ctx.fillStyle='#223';
    ctx.fillRect(-.2*s+w,-.7*s,.14*s,.7*s);
    ctx.fillRect(.06*s-w,-.7*s,.14*s,.7*s);
    ctx.fillStyle=c;
    ctx.fillRect(-.25*s,-1.25*s,.5*s,.6*s);
    ctx.fillStyle='#f1c27d';
    ctx.beginPath();ctx.arc(0,-1.45*s,.2*s,0,7);ctx.fill();
    ctx.fillStyle=c;
    ctx.fillRect(-.38*s,-1.2*s+w*.4,.13*s,.5*s);
    ctx.fillRect(.25*s,-1.2*s-w*.4,.13*s,.5*s);
  }
  ctx.restore();
}

function col(id=S.eq){
  const c=CH.find(x=>x.id===id)||CHR();
  const k=SKN[S.sk[c.id]||0];
  return k.c||c.c;
}

function drawLobby(dt){
  if(cutscene>0)cutscene=Math.max(0,cutscene-dt);
  bg();
  // Estação de metrô 3D estilizada
  g.fillStyle='#19223c';
  g.fillRect(W*.12,HY-LW*.55,W*.76,LW*.55);
  g.fillStyle='#0d1326';
  g.fillRect(W*.34,HY-LW*.48,W*.32,LW*.16);
  g.fillStyle='#ffcc00';
  g.font='900 '+Math.max(14,LW*.11)+'px system-ui';
  g.textAlign='center';
  g.fillText('NEON RUNNER',W/2,HY-LW*.37);

  // Trem passando ao fundo a cada 15s
  const trainPhase=(rot%15);
  if(trainPhase<2.5){
    const tx=-W*.4+(trainPhase/2.5)*W*1.8;
    g.fillStyle='#3a6ea5';g.fillRect(tx,HY-LW*.28,W*.35,LW*.28);
    g.fillStyle='#ffe9a0';
    for(let i=0;i<5;i++)g.fillRect(tx+20+i*48,HY-LW*.22,30,LW*.12);
  }

  // NPCs andando nas laterais
  const npcX1=(rot*35)%(W*.25);
  dc(W*.14+npcX1,H*.56,LW*.32,'#6c5ce7',rot,null,0);
  dc(W*.86-npcX1,H*.56,LW*.32,'#00b894',rot+1,null,0);

  // Plataforma e personagem interativo
  const zoom=cutscene>0?1+(0.75-cutscene)*0.8:1;
  g.save();
  g.translate(W/2,H*.62);
  g.scale(zoom,zoom);
  g.fillStyle='#2c3763';
  g.beginPath();g.ellipse(0,0,LW*.75,LW*.19,0,0,7);g.fill();

  let bounce=Math.abs(Math.sin(rot*2.4))*8;
  let spin=rot*1.5;
  let offX=0;
  if(lobbyAnim.t>0){
    lobbyAnim.t-=dt;
    if(lobbyAnim.kind==='dance')bounce=Math.abs(Math.sin(rot*14))*24;
    else if(lobbyAnim.kind==='spin')spin=rot*16;
    else if(lobbyAnim.kind==='runaway')offX=Math.sin((1.2-lobbyAnim.t)*Math.PI)*LW*1.5;
  }
  dc(offX,-bounce,Math.min(H*.22,LW*.9),col(),lobbyAnim.t>0?rot*2:0,spin,0);
  g.restore();

  // Mini preview canvas na loja se aberto
  const pc=$('#prev');
  if(pc){
    const pg=pc.getContext('2d');
    pg.clearRect(0,0,96,96);
    const ch=CH.find(x=>x.id===prevSel)||CHR();
    dc(48,84,46,col(ch.id),rot,rot*2.5,0,pg);
    const pn=$('#prev-name'),pd=$('#prev-desc');
    if(pn)pn.textContent=`${ch.n} (Nv.${CLV(ch.id)}/5)`;
    if(pd)pd.textContent=ch.a;
  }
}

function draw(){
  g.save();
  if(G.shake>.5&&!S.reduceMotion)g.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  bg();
  const d=G.d;

  // Chão e trilhos com dormentes e parafusos
  poly([P(-1.5,90,0),P(1.5,90,0),P(1.5,-BASE_F+1,0),P(-1.5,-BASE_F+1,0)],bc('gr'));
  for(let k=0;k<30;k++){
    const r=k*3-(d%3);if(r<0)continue;
    const a=P(-1.5,r,0),b=P(1.5,r,0);
    g.strokeStyle=bc('t');g.lineWidth=Math.max(1,3*a.p);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  g.strokeStyle='#ffffff66';g.lineWidth=2;
  for(const l of[-.5,.5]){
    const a=P(l,90,0),b=P(l,-BASE_F+1,0);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  for(let r=90;r>=0;r-=10){
    const rr=r-(d%10),i=Math.floor((d+rr)/10),hh=2+(i*37%5);
    for(const s of[-1,1]){
      const a=P(s*2.4,rr,0),b=P(s*3.6,rr,hh);
      g.fillStyle=bc(i%2?'c1':'c2');
      g.fillRect(Math.min(a.x,b.x),b.y,Math.abs(b.x-a.x),a.y-b.y);
    }
  }

  // Ordena e desenha obstáculos visíveis
  const obs=G.ob.filter(o=>o.z+o.len-d>-1&&o.z-d<90).sort((a,b)=>b.z-a.z);
  for(const o of obs){
    const r=o.z-d,l=o.l;
    g.globalAlpha=o.gh&&r>12?(.25+.15*Math.sin(G.t*18)):1;

    if(o.t==='c'){
      const q=P(l,r,.5+o.h);
      g.fillStyle=o.gm?'#5ff':o.g?'#ffd700':pal('coin','#ffcc00');
      g.beginPath();g.arc(q.x,q.y,LW*.1*q.p,0,7);g.fill();
      g.strokeStyle='#a80';g.lineWidth=2;g.stroke();
    }else if(o.t==='core'){
      const q=P(l,r,.8);
      g.fillStyle='#ff2fa0';g.beginPath();g.arc(q.x,q.y,LW*.2*q.p,0,7);g.fill();
      g.fillStyle='#fff';g.fillText('⚡',q.x-6,q.y+5);
    }else if(o.t==='p'){
      const q=P(l,r,.8),k=PU[o.k];
      g.fillStyle=k.c;g.beginPath();g.arc(q.x,q.y,LW*.22*q.p,0,7);g.fill();
      g.font=`${LW*.25*q.p}px system-ui`;g.textAlign='center';g.textBaseline='middle';
      g.fillStyle='#fff';g.fillText(k.i,q.x,q.y);
    }else if(o.t==='low'){
      const a=P(l-.45,r,.6),b=P(l+.45,r,0);
      g.fillStyle=pal('low','#e33');g.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
      g.fillStyle='#fff';g.fillRect(a.x,a.y+(b.y-a.y)*.4,b.x-a.x,(b.y-a.y)*.2);
    }else if(o.t==='cone'){
      const a=P(l,r,.8),b=P(l-.25,r,0),c=P(l+.25,r,0);
      poly([a,b,c],'#ff8a00');
    }else if(o.t==='high'){
      if(r>14&&r<26){
        const warn=P(0,r,0);g.fillStyle=`rgba(255,204,0,${.3+.3*Math.sin(G.t*20)})`;
        g.fillRect(warn.x-LW*1.4*warn.p,warn.y-4,LW*2.8*warn.p,6);
      }
      const a=P(-1.5,r,1.7),b=P(1.5,r,1.1),f=P(-1.5,r,0),h=P(1.5,r,0);
      g.fillStyle='#888';g.fillRect(f.x-3,a.y,6*f.p+2,f.y-a.y);g.fillRect(h.x-3,a.y,6*f.p+2,f.y-a.y);
      g.fillStyle='#ffcc00';g.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
      g.fillStyle='#222';for(let i=0;i<8;i+=2)g.fillRect(a.x+(b.x-a.x)*i/8,a.y,(b.x-a.x)/8,b.y-a.y);
    }else if(o.t==='ramp'){
      const r1=Math.max(r,-.5);
      poly([P(l-.42,r1,0),P(l+.42,r1,0),P(l+.42,r+o.len,.95),P(l-.42,r+o.len,.95)],'#ff9f1a');
    }else if(o.t==='el'){
      const r1=Math.max(r,-.5);
      poly([P(l-.42,r1,0),P(l+.42,r1,0),P(l+.42,r+o.len,0),P(l-.42,r+o.len,0)],Math.floor(G.t*20)%2?'#00f5ff':'#0077ff');
    }else if(o.t==='drone'){
      const q=P(l,r,.9+Math.sin(G.t*8)*.15);
      g.fillStyle='#ff2e4c';g.beginPath();g.arc(q.x,q.y,LW*.22*q.p,0,7);g.fill();
      g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(q.x-LW*.35*q.p,q.y-8*q.p);g.lineTo(q.x+LW*.35*q.p,q.y-8*q.p);g.stroke();
    }else if(o.t==='rl'){
      const r0=Math.max(r,.15),a=P(l,r0,1.1),b=P(l,r+o.len,1.1),f=P(l,r0,0);
      g.strokeStyle='#d8e4ff';g.lineWidth=Math.max(3,8*a.p);
      g.beginPath();g.moveTo(a.x-LW*.1*a.p,a.y);g.lineTo(b.x-LW*.1*b.p,b.y);
      g.moveTo(a.x+LW*.1*a.p,a.y);g.lineTo(b.x+LW*.1*b.p,b.y);g.stroke();
      g.strokeStyle='#789';g.lineWidth=Math.max(2,4*a.p);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(f.x,f.y);g.stroke();
    }else if(o.t==='tr'){
      const rr=Math.max(r,.15),a=P(l-.45,rr,1.8),b=P(l+.45,rr,0),t1=P(l-.45,rr+o.len,1.8),t2=P(l+.45,rr+o.len,1.8);
      poly([a,{x:b.x,y:a.y},t2,t1],'#6b7a99');
      if(l){
        const sx=l+(l<0?.45:-.45),w0=Math.max(r,.15);
        poly([P(sx,w0,1.8),P(sx,r+o.len,1.8),P(sx,r+o.len,0),P(sx,w0,0)],o.gh?'#7a8ab0':pal('tr','#4a5d86'));
        for(let k=1;k<o.len;k+=2)if(r+k>.3)poly([P(sx,r+k,1.4),P(sx,r+k+1,1.4),P(sx,r+k+1,.9),P(sx,r+k,.9)],'#ffe9a0');
      }
      if(r>.15){
        g.fillStyle=o.mv?'#ff3b30':(o.gh?'#8aa':pal('tr','#3a6ea5'));
        g.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
        g.fillStyle='#ffe9a0';
        g.fillRect(a.x+(b.x-a.x)*.15,a.y+(b.y-a.y)*.15,(b.x-a.x)*.7,(b.y-a.y)*.25);
      }
    }
  }
  g.globalAlpha=1;

  // Player & Active Power-ups visuals
  const q=P(G.px,0,G.y);
  g.globalAlpha=G.inv>0&&Math.floor(G.t*10)%2?.4:1;
  if(G.pw.hov>0){
    const hc=(HOVS.find(x=>x.id===S.eqHov)||HOVS[0]).c;
    g.fillStyle=hc;g.fillRect(q.x-LW*.32,q.y-6,LW*.64,8);
  }
  if(G.pw.jet>0){g.fillStyle='#fa0';g.fillRect(q.x-LW*.12,q.y-LW*.9,LW*.24,LW*.3)}
  if(G.pw.drone>0){
    g.fillStyle='#2ed573';g.beginPath();g.arc(q.x+LW*.48,q.y-LW*.95+Math.sin(G.t*8)*6,10,0,7);g.fill();
  }
  if(G.pw.tw>0){
    g.strokeStyle='#6cf';g.lineWidth=2;g.beginPath();
    g.arc(q.x,q.y-LW*.5,LW*.7,G.t*3,G.t*3+Math.PI*1.3);g.stroke();
  }

  g.save();
  g.translate(q.x,q.y);
  if(G.wr)g.rotate(G.wr.dir*.9);
  if(G.tr){
    G.tr.t-=.016;
    const u=1-Math.max(0,G.tr.t)/.35;
    if(G.tr.k==='spin')g.scale(Math.cos(u*Math.PI*2),1);
    else g.rotate(Math.sin(u*Math.PI)*.8);
  }
  g.scale(1+G.sq,1-G.sq);
  dc(0,0,LW*.5,col(),G.t*(G.y>0?0:1)*(G.dead?0:1),null,G.roll>0);
  g.restore();
  g.globalAlpha=1;

  if(G.chx>0){
    g.globalAlpha=Math.min(1,G.chx);
    dc(W/2+G.px*LW*.5,BY+LW*.55,LW*.8,'#c22',G.t,null,0);
    g.globalAlpha=1;
  }
  if(G.shield>0){
    g.strokeStyle='#4af';g.lineWidth=3;
    g.beginPath();g.arc(q.x,q.y-LW*.4,LW*.55,0,7);g.stroke();
  }

  // Particles from pool
  for(let i=0;i<PT_MAX;i++){
    const p=ptPool[i];
    if(!p.act)continue;
    g.fillStyle=p.c;
    g.fillRect(p.x,p.y,p.sz,p.sz);
  }

  // Weather particles
  const sn=bw('sn'),d2=bw('dt');
  g.globalAlpha=Math.min(1,sn+d2);
  g.fillStyle=bc('pc');
  for(let i=0;i<60;i++)g.fillRect(((i*137%W)+Math.sin(G.t+i)*20+G.t*d2*60)%W,((i*71%H)+G.t*(sn*70+d2*15)*(1+i%3*.3))%H,2.5,2.5);
  g.globalAlpha=1;

  // Speed lines on edges when fast
  if(G.sp>21&&!S.reduceMotion){
    g.strokeStyle='rgba(255,255,255,0.22)';
    g.lineWidth=2;
    for(let i=0;i<10;i++){
      const sx=i%2===0?14+(i*7)%40:W-14-(i*7)%40;
      const sy=((G.t*900+i*130)%H);
      g.beginPath();g.moveTo(sx,sy);g.lineTo(sx,sy+45);g.stroke();
    }
  }

  // Floating combo & coin popups
  g.textAlign='center';g.font='900 22px system-ui';
  G.fl.forEach(f=>{
    g.globalAlpha=Math.min(1,f.l);
    g.fillStyle=f.c||'#fc0';
    g.fillText(f.s,f.x,f.y-(1-f.l)*60);
  });
  g.globalAlpha=1;

  if(G.flashWhite>0){
    g.fillStyle=`rgba(255,230,120,${G.flashWhite})`;
    g.fillRect(0,0,W,H);
  }
  if(G.dead){
    g.fillStyle='rgba(20,20,30,0.35)';
    g.fillRect(0,0,W,H);
  }
  g.restore();

  if(!S.tutDone&&mode==='run'&&G.t<7&&!G.dead){
    g.fillStyle='#fffd';g.font='700 15px system-ui';g.textAlign='center';
    g.fillText('← → pista · ↑ pula · ↓ rola · no ar: → p/ o trem = wall run · cair no trilho = grind',W/2,H-28);
    if(G.t>6.5){S.tutDone=1;sv()}
  }
}

// ===== MAIN LOOP =====
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0);
  lastT=ts;
  rot+=dt;
  if(!G)drawLobby(dt);
  else{
    step(dt*(G.dead?.2:1));
    draw();
  }
  requestAnimationFrame(loop);
}
lobby();
requestAnimationFrame(loop);
</script>
</body>
