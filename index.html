<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neon Runner Mega — V5 Ascension</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hud-top"><b id="hd">0 m</b> · <b id="hc">🪙 0</b> · <b id="hs">0</b> <span id="hrev"></span> <span id="hmode" style="opacity:.85"></span></div>
  <div id="hud-mbar"><i id="hud-mfill" style="width:0%"></i></div>
  <div id="pw"></div>
</div>
<div id="boss-hud">
  <div id="boss-head"><span id="boss-name">👾 DRONE CHEFE OMEGA</span><span id="boss-hp-txt">100/100</span></div>
  <div id="boss-bar"><i id="boss-fill"></i></div>
</div>
<button id="pb" class="b s">⏸</button>
<div id="cb"></div>
<div id="toast"></div>
<div id="sfxcap"></div>
<button id="ab" class="b" onclick="useAb()"></button>
<button id="swap-btn" onclick="swapHero()">🔄</button>
<div id="team-hud"></div>
<div id="weather-hud"></div>
<div id="records-hud"></div>
<div id="profile-card"></div>
<div id="checkpoint-hud"></div>
<div id="rival-echo"></div>
<div id="danger-edge"></div>
<div id="big"></div>
<div id="ui"></div>
<div id="ascension-banner"></div>

<script src="js/game.js"></script>
</body>
</html>
