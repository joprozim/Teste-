<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d1c">
  <meta name="description" content="Neon Runner Mega: corra, pule, deslize e sobreviva.">
  <title>Neon Runner Mega — Reconstrução</title>
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <main id="game">
    <canvas id="game-canvas" aria-label="Área do jogo"></canvas>
    <section id="hud" aria-live="polite">
      <span>Distância: <strong id="distance">0</strong> m</span>
      <span>Moedas: <strong id="coins">0</strong></span>
      <span id="shield-status">SEM ESCUDO</span>
    </section>
    <div id="countdown" aria-live="assertive"></div>
    <section id="menu">
      <h1>NEON RUNNER</h1>
      <p>Corra, desvie, pule e deslize. Colete moedas e escudos!</p>
      <button id="start-button" type="button">JOGAR</button>
      <p class="hint">← → mudar de pista · ↑ pular · ↓ deslizar<br>Celular: deslize o dedo para os lados, para cima ou para baixo.</p>
    </section>
    <section id="game-over" hidden>
      <h2>FIM DE JOGO</h2>
      <p>Você percorreu <strong id="final-distance">0</strong> metros.</p>
      <button id="restart-button" type="button">JOGAR DE NOVO</button>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
